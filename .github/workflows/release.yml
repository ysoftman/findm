name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X main.Version=${VERSION}"
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o findm-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o findm-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o findm-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o findm-linux-arm64 .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            findm-darwin-arm64
            findm-darwin-amd64
            findm-linux-amd64
            findm-linux-arm64
